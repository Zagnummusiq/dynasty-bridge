services:
  - type: web
    name: dynasty-bridge-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: node init_db.js && node index.js
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: postgresql://imanga_db_user:Ax4Fed38yJkZedTyTwCXshwEk2JVjJeR@dpg-d9hi1hkm0tmc73atrnbg-a/imanga_db?ssl=true

  - type: static
    name: dynasty-bridge-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://dynasty-bridge-backend.onrender.com
